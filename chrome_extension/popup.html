<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 350px; font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 16px; }
  h2 { color: #7c3aed; margin: 0 0 12px; font-size: 16px; }
  .status { padding: 8px; border-radius: 6px; margin-bottom: 12px; font-size: 12px; }
  .success { background: #065f46; color: #6ee7b7; }
  .error { background: #7f1d1d; color: #fca5a5; }
  .info { background: #1e3a5f; color: #93c5fd; }
  button { width: 100%; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin: 4px 0; font-size: 13px; }
  .btn-primary { background: #7c3aed; color: white; }
  .btn-primary:hover { background: #6d28d9; }
  .btn-secondary { background: #374151; color: #d1d5db; }
  .btn-secondary:hover { background: #4b5563; }
  .data-preview { background: #111827; border-radius: 6px; padding: 10px; margin-top: 10px; font-size: 11px; max-height: 200px; overflow-y: auto; }
  .data-row { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid #1f2937; }
  .label { color: #9ca3af; }
  .value { color: #e5e7eb; font-weight: bold; text-align: right; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
  <h2>MarketLens Scout</h2>
  <div id="status" class="status info">Click Scout to capture this product</div>
  <button class="btn-primary" id="scout">Scout This Product</button>
  <button class="btn-secondary" id="send">Send to MarketLens Desktop</button>
  <div id="preview" class="data-preview" style="display:none;"></div>
  <script src="popup.js"></script>
</body>
</html>
