<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f0f1a"/>
    </linearGradient>
    <linearGradient id="orange-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="50%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <linearGradient id="ai-badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Dark background circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>

  <!-- Orange outer ring -->
  <circle cx="100" cy="100" r="93" stroke="url(#orange-ring)" stroke-width="4" fill="none"/>
  
  <!-- Orange ring dots -->
  <circle cx="100" cy="9" r="4" fill="#f59e0b"/>
  <circle cx="100" cy="191" r="4" fill="#f59e0b"/>
  <circle cx="9" cy="100" r="4" fill="#f59e0b"/>
  <circle cx="191" cy="100" r="4" fill="#f59e0b"/>

  <!-- Inner ring -->
  <circle cx="100" cy="100" r="78" stroke="#f59e0b" stroke-width="1.5" fill="none" opacity="0.3"/>

  <!-- Robot head (white rounded square) -->
  <rect x="58" y="52" width="84" height="76" rx="22" fill="white"/>
  
  <!-- Robot eyes -->
  <circle cx="80" cy="82" r="9" fill="#f59e0b"/>
  <circle cx="120" cy="82" r="9" fill="#f59e0b"/>
  
  <!-- Robot smile -->
  <path d="M 82 100 Q 100 116 118 100" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Antenna / top detail -->
  <line x1="100" y1="52" x2="100" y2="38" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <circle cx="100" cy="35" r="4" fill="white"/>

  <!-- Sun / star top-left -->
  <circle cx="32" cy="32" r="10" fill="#fbbf24"/>
  <line x1="32" y1="16" x2="32" y2="12" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="52" x2="32" y2="48" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="16" y1="32" x2="12" y2="32" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="52" y1="32" x2="48" y2="32" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="20.7" y1="20.7" x2="17.9" y2="17.9" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="43.3" y1="43.3" x2="46.1" y2="46.1" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="43.3" y1="20.7" x2="46.1" y2="17.9" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="20.7" y1="43.3" x2="17.9" y2="46.1" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Bar chart top-right -->
  <rect x="148" y="22" width="7" height="22" rx="2" fill="#f97316"/>
  <rect x="158" y="14" width="7" height="30" rx="2" fill="#f97316"/>
  <rect x="168" y="18" width="7" height="26" rx="2" fill="#f97316"/>
  <rect x="178" y="10" width="7" height="34" rx="2" fill="#f97316"/>

  <!-- AI badge -->
  <rect x="140" y="74" width="40" height="26" rx="13" fill="url(#ai-badge)" filter="url(#glow)"/>
  <text x="160" y="91" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="white">AI</text>

  <!-- Small decorative dots -->
  <circle cx="50" cy="160" r="3" fill="#f59e0b" opacity="0.5"/>
  <circle cx="150" cy="160" r="3" fill="#f59e0b" opacity="0.5"/>
  <circle cx="100" cy="170" r="3" fill="#f59e0b" opacity="0.5"/>
</svg>