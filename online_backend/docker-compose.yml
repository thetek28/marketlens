version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: marketlens-db
    environment:
      POSTGRES_DB: marketlens
      POSTGRES_USER: marketlens
      POSTGRES_PASSWORD: ${DB_PASSWORD:-marketlens_secret_2024}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../online_db/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketlens"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: marketlens-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # FastAPI Backend
  backend:
    build:
      context: ..
      dockerfile: online_backend/Dockerfile
    container_name: marketlens-backend
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=marketlens
      - DB_USER=marketlens
      - DB_PASSWORD=${DB_PASSWORD:-marketlens_secret_2024}
      - DB_SSL_MODE=disable
      - REDIS_URL=redis://redis:6379/0
      - MLENS_JWT_SECRET=${MLENS_JWT_SECRET:-change-me-in-production}
      - PORT=8000
      - WORKERS=4
      - DEBUG=false
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
